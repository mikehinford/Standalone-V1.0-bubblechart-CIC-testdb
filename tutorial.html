<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Chart Tutorial</title>
    <link rel="stylesheet" href="tutorial.css">
</head>
<body>
    <div class="tutorial-container">
        <!-- Layered stage for composited slides -->
        <div class="layer-stage" aria-live="polite">
            <img class="layer-image" data-suffix="002" src="tutorial/B-Chart Tutorial Slides v3.002.png" alt="Layer 002">
            <img class="layer-image" data-suffix="003" src="tutorial/B-Chart Tutorial Slides v3.003.png" alt="Layer 003">
            <img class="layer-image" data-suffix="004" src="tutorial/B-Chart Tutorial Slides v3.004.png" alt="Layer 004">
            <img class="layer-image" data-suffix="005" src="tutorial/B-Chart Tutorial Slides v3.005.png" alt="Layer 005">
            <img class="layer-image" data-suffix="007" src="tutorial/B-Chart Tutorial Slides v3.007.png" alt="Layer 007">
            <img class="layer-image" data-suffix="009" src="tutorial/B-Chart Tutorial Slides v3.009.png" alt="Layer 009">
            <img class="layer-image" data-suffix="011" src="tutorial/B-Chart Tutorial Slides v3.011.png" alt="Layer 011">
            <img class="layer-image" data-suffix="012" src="tutorial/B-Chart Tutorial Slides v3.012.png" alt="Layer 012">
            <img class="layer-image" data-suffix="014" src="tutorial/B-Chart Tutorial Slides v3.014.png" alt="Layer 014">
            <img class="layer-image" data-suffix="016" src="tutorial/B-Chart Tutorial Slides v3.016.png" alt="Layer 016">
            <img class="layer-image" data-suffix="017" src="tutorial/B-Chart Tutorial Slides v3.017.png" alt="Layer 017">
            <img class="layer-image" data-suffix="018" src="tutorial/B-Chart Tutorial Slides v3.018.png" alt="Layer 018">
            <img class="layer-image" data-suffix="019" src="tutorial/B-Chart Tutorial Slides v3.019.png" alt="Layer 019">
            <img class="layer-image" data-suffix="020" src="tutorial/B-Chart Tutorial Slides v3.020.png" alt="Layer 020">
        </div>
        <!-- Navigation buttons -->
        <button class="nav-btn prev-btn" aria-label="Previous slide">&#10094;</button>
        <button class="nav-btn next-btn" aria-label="Next slide">&#10095;</button>
    </div>

    <script src="tutorial.js"></script>
</body>
</html>
