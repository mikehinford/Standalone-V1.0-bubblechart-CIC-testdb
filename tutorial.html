<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Chart Tutorial</title>
    <link rel="stylesheet" href="tutorial.css">
</head>
<body>
    <div class="tutorial-container">
        <!-- Layered stage for composited slides -->
        <div class="layer-stage" aria-live="polite">
            <img class="layer-image" data-suffix="002" src="tutorial/B-Chart Tutorial Slides v2.002.png" alt="Layer 002">
            <img class="layer-image" data-suffix="003" src="tutorial/B-Chart Tutorial Slides v2.003.png" alt="Layer 003">
            <img class="layer-image" data-suffix="004" src="tutorial/B-Chart Tutorial Slides v2.004.png" alt="Layer 004">
            <img class="layer-image" data-suffix="006" src="tutorial/B-Chart Tutorial Slides v2.006.png" alt="Layer 006">
            <img class="layer-image" data-suffix="008" src="tutorial/B-Chart Tutorial Slides v2.008.png" alt="Layer 008">
            <img class="layer-image" data-suffix="010" src="tutorial/B-Chart Tutorial Slides v2.010.png" alt="Layer 010">
            <img class="layer-image" data-suffix="011" src="tutorial/B-Chart Tutorial Slides v2.011.png" alt="Layer 011">
            <img class="layer-image" data-suffix="013" src="tutorial/B-Chart Tutorial Slides v2.013.png" alt="Layer 013">
            <img class="layer-image" data-suffix="015" src="tutorial/B-Chart Tutorial Slides v2.015.png" alt="Layer 015">
            <img class="layer-image" data-suffix="016" src="tutorial/B-Chart Tutorial Slides v2.016.png" alt="Layer 016">
            <img class="layer-image" data-suffix="017" src="tutorial/B-Chart Tutorial Slides v2.017.png" alt="Layer 017">
            <img class="layer-image" data-suffix="018" src="tutorial/B-Chart Tutorial Slides v2.018.png" alt="Layer 018">
            <img class="layer-image" data-suffix="019" src="tutorial/B-Chart Tutorial Slides v2.019.png" alt="Layer 019">
            <img class="layer-image" data-suffix="000" src="tutorial/B-Chart Tutorial Slides v2.000.png" alt="Layer 000">
        </div>
        <!-- Navigation buttons -->
        <button class="nav-btn prev-btn" aria-label="Previous slide">&#10094;</button>
        <button class="nav-btn next-btn" aria-label="Next slide">&#10095;</button>
        
        <!-- Pagination -->
        <div class="pagination">
            <span class="current-slide">1</span> / <span class="total-slides">10</span>
        </div>
    </div>

    <script src="tutorial.js"></script>
</body>
</html>
